<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Grave</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{background:#050403;overflow:hidden;font-family:Georgia,serif;color:#f2ddb0}
#stage{position:fixed;inset:0;overflow:hidden;background:#050403}
#art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center center;display:block}
#overlay{position:absolute;inset:0}
.hotspot{position:absolute;display:block;background:transparent;border:0;outline:none;cursor:pointer;text-decoration:none}
#music{left:5.5%;top:7.2%;width:12%;height:9.2%}
#menuBtn{left:82%;top:7.1%;width:12.5%;height:9.4%}
#enter{left:30.5%;top:65.8%;width:39%;height:9.2%}
#personaggi{left:3%;top:83.4%;width:14%;height:11%}
#capitoli{left:19%;top:83.4%;width:14%;height:11%}
#storia{left:35%;top:83.4%;width:14%;height:11%}
#whitechapel{left:50.5%;top:83.4%;width:18%;height:11%}
#diario{left:69%;top:83.4%;width:13.5%;height:11%}
#rubinoLink{left:84.5%;top:83.4%;width:12.5%;height:11%}
#drawer{position:absolute;top:0;right:0;width:min(78vw,320px);height:100%;transform:translateX(102%);transition:transform .28s ease;background:rgba(10,7,5,.94);box-shadow:-18px 0 40px rgba(0,0,0,.45);backdrop-filter:blur(8px);padding:22px 18px;display:flex;flex-direction:column;gap:14px;border-left:1px solid rgba(255,221,160,.18)}
#drawer.open{transform:translateX(0)}
.drawer-title{font-size:1.1rem;letter-spacing:.14em;color:#f1dcad;text-transform:uppercase;margin-bottom:6px}
.drawer-link{color:#e7ca92;text-decoration:none;font-size:1.02rem;padding:12px 10px;border:1px solid rgba(255,221,160,.12);border-radius:12px;background:rgba(255,255,255,.02)}
.drawer-link:hover{color:#fff;border-color:rgba(255,221,160,.3)}
.music-state{color:#e7ca92;font-size:1rem;padding:12px 10px;border:1px solid rgba(255,221,160,.12);border-radius:12px;background:rgba(255,255,255,.02)}
@media (max-width:720px){
#drawer{width:min(86vw,300px)}
}
</style>
</head>
<body>
<div id="stage">
  <img id="art" src="images/homepage-master.png" alt="The Grave">
  <div id="overlay">
    <button class="hotspot" id="music" aria-label="Musica"></button>
    <button class="hotspot" id="menuBtn" aria-label="Menu"></button>
    <a class="hotspot" id="enter" href="book.html" aria-label="Entra nel Romanzo"></a>

    <a class="hotspot" id="personaggi" href="book.html" aria-label="Personaggi"></a>
    <a class="hotspot" id="capitoli" href="capitoli.html" aria-label="Capitoli"></a>
    <a class="hotspot" id="storia" href="storia.html" aria-label="La Storia"></a>
    <a class="hotspot" id="whitechapel" href="whitechapel.html" aria-label="Whitechapel 1888"></a>
    <a class="hotspot" id="diario" href="diario.html" aria-label="Diario"></a>
    <a class="hotspot" id="rubinoLink" href="rubino.html" aria-label="Il Rubino"></a>

    <aside id="drawer" aria-label="Menu">
      <div class="drawer-title">THE GRAVE</div>
      <div class="music-state" id="musicState">Musica OFF</div>
      <a class="drawer-link" href="book.html">Entra nel Romanzo</a>
      <a class="drawer-link" href="capitoli.html">Capitoli</a>
      <a class="drawer-link" href="storia.html">La Storia</a>
      <a class="drawer-link" href="whitechapel.html">Whitechapel 1888</a>
      <a class="drawer-link" href="diario.html">Diario</a>
      <a class="drawer-link" href="rubino.html">Il Rubino</a>
    </aside>
  </div>
</div>
<script>
const menuBtn=document.getElementById('menuBtn');
const drawer=document.getElementById('drawer');
const musicBtn=document.getElementById('music');
const musicState=document.getElementById('musicState');

menuBtn.addEventListener('click',()=>drawer.classList.toggle('open'));

musicBtn.addEventListener('click',()=>{
  const on=musicState.textContent.includes('ON');
  musicState.textContent=on?'Musica OFF':'Musica ON';
});
</script>
</body>
</html>
