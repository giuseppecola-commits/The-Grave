<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Grave</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{background:#050403;overflow:hidden;font-family:Georgia,serif;color:#f2ddb0}

#stage{
position:fixed;
inset:0;
overflow:hidden;
background:#050403;
}

#art{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:contain;
object-position:center;
display:block;
}

#overlay{
position:absolute;
inset:0;
}

.hotspot{
position:absolute;
display:block;
background:transparent;
border:0;
cursor:pointer;
text-decoration:none;
}

#music{left:5.5%;top:7.2%;width:12%;height:9.2%;}
#menuBtn{left:82%;top:7.1%;width:12.5%;height:9.4%;}

/* PULSANTE INIZIA A LEGGERE */
#enter{
left:30.5%;
top:65.8%;
width:39%;
height:9.2%;
}

/* MENU INFERIORE */
#personaggi{left:3%;top:83.4%;width:14%;height:11%;}
#capitoli{left:19%;top:83.4%;width:14%;height:11%;}
#storia{left:35%;top:83.4%;width:14%;height:11%;}
#whitechapel{left:50.5%;top:83.4%;width:18%;height:11%;}
#diario{left:69%;top:83.4%;width:13.5%;height:11%;}
#rubinoLink{left:84.5%;top:83.4%;width:12.5%;height:11%;}

#drawer{
position:absolute;
top:0;
right:0;
width:min(78vw,320px);
height:100%;
transform:translateX(102%);
transition:transform .3s ease;
background:rgba(10,7,5,.95);
padding:22px 18px;
display:flex;
flex-direction:column;
gap:14px;
border-left:1px solid rgba(255,221,160,.18);
}

#drawer.open{
transform:translateX(0);
}

.drawer-title{
font-size:1.1rem;
letter-spacing:.15em;
text-transform:uppercase;
color:#f2ddb0;
}

.drawer-link{
text-decoration:none;
color:#e7ca92;
padding:12px;
border:1px solid rgba(255,221,160,.12);
border-radius:10px;
}

.drawer-link:hover{
color:white;
}

.music-state{
padding:12px;
border:1px solid rgba(255,221,160,.12);
border-radius:10px;
color:#e7ca92;
}

</style>
</head>

<body>

<div id="stage">

<img id="art" src="images/homepage-master.png" alt="The Grave">

<div id="overlay">

<button class="hotspot" id="music"></button>

<button class="hotspot" id="menuBtn"></button>

<!-- QUESTA È LA MODIFICA -->
<a class="hotspot" id="enter" href="capitolo1.html"></a>

<a class="hotspot" id="personaggi" href="book.html"></a>

<a class="hotspot" id="capitoli" href="capitoli.html"></a>

<a class="hotspot" id="storia" href="storia.html"></a>

<a class="hotspot" id="whitechapel" href="whitechapel.html"></a>

<a class="hotspot" id="diario" href="diario.html"></a>

<a class="hotspot" id="rubinoLink" href="rubino.html"></a>

<aside id="drawer">

<div class="drawer-title">THE GRAVE</div>

<div class="music-state" id="musicState">
Musica OFF
</div>

<a class="drawer-link" href="capitolo1.html">📖 Inizia a leggere</a>

<a class="drawer-link" href="book.html">Personaggi</a>

<a class="drawer-link" href="capitoli.html">Capitoli</a>

<a class="drawer-link" href="storia.html">La Storia</a>

<a class="drawer-link" href="whitechapel.html">Whitechapel 1888</a>

<a class="drawer-link" href="diario.html">Diario</a>

<a class="drawer-link" href="rubino.html">Il Rubino</a>

</aside>

</div>

</div>

<script>

const menuBtn=document.getElementById("menuBtn");
const drawer=document.getElementById("drawer");

menuBtn.addEventListener("click",()=>{
drawer.classList.toggle("open");
});

const musicBtn=document.getElementById("music");
const musicState=document.getElementById("musicState");

musicBtn.addEventListener("click",()=>{

const on=musicState.textContent.includes("ON");

musicState.textContent=on ? "Musica OFF" : "Musica ON";

});

</script>

</body>
</html>
