<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Grave</title>
  <style>
    :root{
      --gold:#d8b46b;
      --gold2:#f2ddb0;
      --red:#7e0f12;
      --bg:#090604;
      --glass:rgba(0,0,0,.26);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;min-height:100%}
    body{
      min-height:100svh;
      font-family:Georgia,serif;
      color:var(--gold2);
      background:var(--bg);
      overflow:hidden;
    }
    .bg{
      position:fixed;
      inset:0;
      background:
        linear-gradient(to bottom, rgba(0,0,0,.18), rgba(0,0,0,.52)),
        url("images/background.png") center center / cover no-repeat;
      transform:scale(1.02);
      z-index:-3;
    }
    .mist{
      position:fixed;
      inset:-10%;
      background:
        radial-gradient(circle at 50% 58%, rgba(126,15,18,.16), transparent 26%),
        radial-gradient(circle at 20% 40%, rgba(255,255,255,.07), transparent 20%),
        radial-gradient(circle at 80% 52%, rgba(255,255,255,.06), transparent 22%),
        linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,.2) 58%, rgba(0,0,0,.4));
      filter:blur(12px);
      animation:mistMove 18s ease-in-out infinite alternate;
      z-index:-2;
      pointer-events:none;
      opacity:.9;
    }
    .page{
      min-height:100svh;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      padding:clamp(12px,2.2vh,22px) clamp(12px,2.2vw,22px) calc(14px + env(safe-area-inset-bottom));
      gap:clamp(10px,1.6vh,16px);
    }
    .topbar{
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      gap:12px;
    }
    .orb{
      width:82px;
      height:82px;
      border-radius:50%;
      border:1px solid rgba(255,224,154,.55);
      background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.14), rgba(0,0,0,.35) 48%, rgba(0,0,0,.6));
      color:var(--gold2);
      box-shadow:0 0 0 1px rgba(0,0,0,.35), inset 0 0 18px rgba(0,0,0,.5), 0 0 22px rgba(0,0,0,.2);
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:2px;
      justify-self:start;
      text-align:center;
      padding:8px;
      font-family:Georgia,serif;
    }
    .orb.right{justify-self:end}
    .orb .ico{font-size:1.55rem;line-height:1}
    .orb .txt{font-size:.72rem;letter-spacing:.08em}
    .crest{
      display:flex;
      align-items:center;
      justify-content:center;
      width:88px;
      height:88px;
      margin:0 auto;
      border-radius:50%;
      color:#caa25e;
      font-size:2rem;
      border:1px solid rgba(255,220,150,.22);
      background:radial-gradient(circle at 50% 35%, rgba(255,230,180,.08), rgba(0,0,0,.1) 45%, rgba(0,0,0,.28));
      text-shadow:0 0 10px rgba(0,0,0,.55);
      box-shadow:inset 0 0 18px rgba(0,0,0,.3);
      letter-spacing:-.08em;
    }
    .title{
      text-align:center;
      margin-top:clamp(4px,1vh,10px);
      position:relative;
    }
    .title .thin{
      font-size:clamp(1.1rem,2vw,1.55rem);
      letter-spacing:.2em;
      color:#edd4a6;
      text-transform:uppercase;
      margin-bottom:4px;
    }
    .title h1{
      font-size:clamp(3rem,8vw,6.6rem);
      line-height:.9;
      letter-spacing:.03em;
      color:#e6c792;
      text-shadow:0 2px 10px rgba(0,0,0,.8);
      font-weight:700;
    }
    .title h1 span{
      display:block;
      font-size:.42em;
      letter-spacing:.2em;
      margin-bottom:4px;
      color:#f0deb2;
      font-weight:400;
    }
    .divider{
      width:min(70vw,560px);
      height:1px;
      margin:10px auto 0;
      background:linear-gradient(90deg, transparent, rgba(214,160,78,.8), transparent);
      box-shadow:0 0 12px rgba(214,160,78,.25);
    }
    .hero{
      position:relative;
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:0;
    }
    .scene{
      position:relative;
      width:min(94vw,980px);
      height:min(100%, 100%);
      display:grid;
      grid-template-columns:minmax(0,1.15fr) minmax(260px,.9fr);
      gap:clamp(10px,1.8vw,24px);
      align-items:stretch;
    }
    .left-panel,.right-panel{
      border-radius:18px;
      background:linear-gradient(to bottom, rgba(0,0,0,.24), rgba(0,0,0,.12));
      box-shadow:inset 0 0 0 1px rgba(255,220,150,.08);
      position:relative;
      overflow:hidden;
    }
    .left-panel{
      display:flex;
      align-items:flex-end;
      justify-content:flex-start;
      padding:24px;
      background:
        linear-gradient(to bottom, rgba(0,0,0,.18), rgba(0,0,0,.18)),
        radial-gradient(circle at 22% 18%, rgba(255,205,130,.18), transparent 18%),
        radial-gradient(circle at 12% 52%, rgba(255,255,255,.08), transparent 20%),
        radial-gradient(circle at 54% 42%, rgba(255,255,255,.08), transparent 18%);
    }
    .right-panel{
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      padding:24px 18px;
      background:
        linear-gradient(to bottom, rgba(0,0,0,.18), rgba(0,0,0,.18)),
        radial-gradient(circle at 60% 34%, rgba(255,220,150,.08), transparent 18%),
        linear-gradient(135deg, rgba(81,54,24,.35), rgba(0,0,0,.08));
    }
    .map-box{
      width:min(88%, 280px);
      aspect-ratio: .82 / 1;
      border-radius:14px;
      border:1px solid rgba(255,220,150,.18);
      background:
        linear-gradient(to bottom, rgba(0,0,0,.08), rgba(0,0,0,.28)),
        radial-gradient(circle at 50% 30%, rgba(255,236,178,.22), transparent 35%),
        linear-gradient(135deg, rgba(108,72,32,.48), rgba(44,30,15,.55));
      box-shadow:inset 0 0 0 1px rgba(255,220,150,.06), 0 0 40px rgba(0,0,0,.25);
      position:relative;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:#d9b57a;
      letter-spacing:.12em;
      text-transform:uppercase;
      font-size:clamp(.95rem,1.9vw,1.15rem);
      padding:16px;
    }
    .map-box:before{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(90deg, rgba(0,0,0,.18) 1px, transparent 1px) 0 0/22px 22px,
        linear-gradient(rgba(0,0,0,.16) 1px, transparent 1px) 0 0/22px 22px;
      opacity:.22;
      mix-blend-mode:multiply;
    }
    .map-box .map-title{
      position:relative;
      z-index:1;
      font-size:1.15em;
      line-height:1.15;
    }
    .center{
      position:absolute;
      inset:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      pointer-events:none;
    }
    .quote{
      width:min(84vw,720px);
      text-align:center;
      margin-bottom:clamp(8px,1.4vh,16px);
      font-size:clamp(1rem,2vw,1.35rem);
      line-height:1.35;
      color:#f0dfbb;
      text-shadow:0 2px 10px rgba(0,0,0,.85);
      letter-spacing:.02em;
      padding:0 10px;
    }
    .ruby-wrap{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      width:min(54vw,380px);
      max-width:380px;
      aspect-ratio:1 / 1.15;
      pointer-events:auto;
      margin-top:clamp(10px,1.4vh,16px);
    }
    .ruby{
      width:min(60%,210px);
      filter:drop-shadow(0 0 24px rgba(180,0,0,.72)) drop-shadow(0 0 56px rgba(255,0,0,.18));
      animation:rubyPulse 3s ease-in-out infinite;
      transform-origin:center center;
      z-index:3;
    }
    .ruby-glow{
      position:absolute;
      width:min(78%,290px);
      height:min(78%,290px);
      border-radius:50%;
      background:radial-gradient(circle, rgba(153,0,0,.24), rgba(153,0,0,.06) 35%, transparent 68%);
      filter:blur(2px);
      z-index:1;
      animation:glowPulse 3s ease-in-out infinite;
    }
    .enter{
      pointer-events:auto;
      margin-top:clamp(8px,1.1vh,14px);
      width:min(70vw,350px);
      display:block;
      transition:transform .25s ease, filter .25s ease;
    }
    .enter img{
      width:100%;
      display:block;
    }
    .enter:hover{
      transform:translateY(-2px) scale(1.02);
      filter:drop-shadow(0 0 14px rgba(255,190,80,.2));
    }
    .bottom-nav{
      display:grid;
      grid-template-columns:repeat(6, minmax(0,1fr));
      gap:10px;
      width:min(100%,1120px);
      margin:0 auto;
      padding:14px 10px 0;
      pointer-events:auto;
    }
    .nav-item{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      gap:8px;
      color:#e1c88c;
      text-decoration:none;
      text-align:center;
      padding:10px 8px 12px;
      border-radius:14px;
      background:linear-gradient(to bottom, rgba(0,0,0,.18), rgba(0,0,0,.08));
      box-shadow:inset 0 0 0 1px rgba(255,220,150,.08);
      min-height:104px;
    }
    .nav-icon{
      width:42px;
      height:42px;
      border-radius:50%;
      display:grid;
      place-items:center;
      border:1px solid rgba(255,220,150,.3);
      background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.12), rgba(0,0,0,.35));
      color:#f1dfb5;
      font-size:1.1rem;
      box-shadow:inset 0 0 12px rgba(0,0,0,.35);
    }
    .nav-label{
      font-size:.88rem;
      line-height:1.05;
      letter-spacing:.04em;
      text-shadow:0 0 6px rgba(0,0,0,.85);
      white-space:nowrap;
    }
    .nav-label.small{
      font-size:.83rem;
    }
    .nav-item:hover{
      color:#fff;
    }
    .nav-item:hover .nav-icon{
      border-color:rgba(255,220,150,.55);
      box-shadow:0 0 12px rgba(255,180,60,.15), inset 0 0 12px rgba(0,0,0,.2);
    }
    @keyframes rubyPulse{
      0%,100%{transform:scale(1)}
      50%{transform:scale(1.045)}
    }
    @keyframes glowPulse{
      0%,100%{opacity:.85;transform:scale(1)}
      50%{opacity:1;transform:scale(1.08)}
    }
    @keyframes mistMove{
      from{transform:translate3d(-1.5%,0,0) scale(1.02)}
      to{transform:translate3d(1.5%,-1.2%,0) scale(1.05)}
    }
    @media (max-width:980px){
      .scene{
        grid-template-columns:1fr;
        width:min(100%,760px);
      }
      .left-panel{
        min-height:18vh;
      }
      .right-panel{
        min-height:18vh;
      }
      .center{
        position:relative;
        inset:auto;
        margin-top:-10px;
      }
    }
    @media (max-width:720px){
      .orb{
        width:72px;height:72px;
      }
      .crest{
        width:72px;height:72px;font-size:1.6rem;
      }
      .title .thin{
        font-size:.95rem;
      }
      .title h1{
        font-size:clamp(2.7rem,14vw,4.6rem);
      }
      .quote{
        font-size:clamp(.95rem,4.6vw,1.2rem);
      }
      .ruby-wrap{
        width:min(72vw,300px);
      }
      .enter{
        width:min(74vw,300px);
      }
      .bottom-nav{
        grid-template-columns:repeat(2, minmax(0,1fr));
        gap:10px;
      }
      .nav-item{
        min-height:88px;
      }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="mist" aria-hidden="true"></div>

  <main class="page">
    <header class="topbar" aria-label="Controlli superiori">
      <button class="orb" type="button" aria-label="Musica">
        <span class="ico">♫</span>
        <span class="txt">MUSICA OFF</span>
      </button>

      <div class="crest" aria-label="The Grave">TG</div>

      <button class="orb right" type="button" aria-label="Menu">
        <span class="ico">☰</span>
        <span class="txt">MENU</span>
      </button>
    </header>

    <section class="title">
      <div class="thin">THE</div>
      <h1>GRAVE</h1>
      <div class="divider" aria-hidden="true"></div>
    </section>

    <section class="hero" aria-label="Home The Grave">
      <div class="scene">
        <div class="left-panel" aria-hidden="true"></div>

        <div class="right-panel" aria-hidden="true">
          <div class="map-box">
            <div class="map-title">
              WHITECHAPEL<br>1888
            </div>
          </div>
        </div>
      </div>

      <div class="center">
        <p class="quote">"Il tempo può cambiare il destino,<br>ma non può cancellare il passato."</p>

        <div class="ruby-wrap">
          <div class="ruby-glow" aria-hidden="true"></div>
          <img class="ruby" src="images/ruby.png" alt="Rubino">
        </div>

        <a class="enter" href="#" aria-label="Entra nel Romanzo">
          <img src="images/button.png" alt="Entra nel Romanzo">
        </a>
      </div>
    </section>

    <nav class="bottom-nav" aria-label="Sezioni principali">
      <a class="nav-item" href="#"><span class="nav-icon">👤</span><span class="nav-label">Personaggi</span></a>
      <a class="nav-item" href="#"><span class="nav-icon">📖</span><span class="nav-label">Capitoli</span></a>
      <a class="nav-item" href="#"><span class="nav-icon">⏱</span><span class="nav-label">La Storia</span></a>
      <a class="nav-item" href="#"><span class="nav-icon">🗺</span><span class="nav-label small">Whitechapel<br>1888</span></a>
      <a class="nav-item" href="#"><span class="nav-icon">✒</span><span class="nav-label">Diario</span></a>
      <a class="nav-item" href="#"><span class="nav-icon">💎</span><span class="nav-label">Il Rubino</span></a>
    </nav>
  </main>
</body>
</html>
