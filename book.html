<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Grave - Il Romanzo</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
}

body{

background:
linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.55)),
url("images/background.png") center center/cover no-repeat;

font-family:Georgia,serif;
color:#ead8b0;

display:flex;
justify-content:center;
align-items:center;

}

#book{

width:min(92%,900px);

background:rgba(15,10,7,.82);

border:2px solid rgba(214,177,107,.45);

border-radius:18px;

padding:60px 40px;

box-shadow:0 0 45px rgba(0,0,0,.65);

text-align:center;

backdrop-filter:blur(6px);

}

h1{

font-size:68px;

letter-spacing:3px;

color:#e7c57b;

margin-bottom:10px;

}

h2{

font-size:26px;

font-weight:normal;

margin-bottom:45px;

color:#d8bb85;

}

p{

font-size:24px;

line-height:1.8;

margin-bottom:55px;

}

.button{

display:inline-block;

padding:18px 38px;

margin:10px;

text-decoration:none;

color:#f2e3be;

background:#5f0d10;

border:1px solid #b38747;

border-radius:10px;

font-size:22px;

transition:.3s;

}

.button:hover{

background:#7d1216;

transform:scale(1.03);

}

@media(max-width:700px){

#book{

padding:35px 22px;

}

h1{

font-size:44px;

}

h2{

font-size:20px;

}

p{

font-size:19px;

}

.button{

display:block;

margin:15px auto;

width:100%;

}

}

</style>

</head>

<body>

<div id="book">

<h1>THE GRAVE</h1>

<h2>Il Romanzo</h2>

<p>

Benvenuto.

</p>

</div>
